name: CI

run-name: "CI - ${{ github.event.inputs.work || github.event_name }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      work:
        description: "Label for this verification run (Work 1 / Work 2 / Work 3 / Work 4 / all)"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  security-and-tests:
    name: SAST + SCA + tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: work1-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: work1-api/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: SAST - bandit
        run: |
          mkdir -p ../reports
          bandit -r app -x app/__pycache__ -f json -o ../reports/bandit-report.json
          bandit -r app -x app/__pycache__ -f txt

      - name: SCA - pip-audit
        run: |
          mkdir -p ../reports
          pip-audit -r requirements.txt --strict -f json -o ../reports/pip-audit-report.json

      - name: Tests
        env:
          DB_PATH: ${{ runner.temp }}/ci.db
          JWT_SECRET: ci-only-hmac-key-0123456789abcdef0123456789abcdef
        run: |
          mkdir -p ../reports
          pytest -q --junitxml=../reports/pytest-report.xml

      - name: Validate Work 1-4 artifacts
        working-directory: .
        run: python shared/validate_works.py --json reports/validation-report.json

      - name: Build security-report.json
        working-directory: .
        run: python shared/build_security_report.py reports

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: reports/
          if-no-files-found: warn
          retention-days: 90
