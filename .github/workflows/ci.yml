name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-tests:
    name: SAST + SCA + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work1-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: work1-api/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: SAST - bandit
        run: bandit -r app -x app/__pycache__ -f txt

      - name: SCA - pip-audit
        run: pip-audit -r requirements.txt --strict

      - name: Tests
        env:
          DB_PATH: ${{ runner.temp }}/ci.db
          JWT_SECRET: ci-only-hmac-key-0123456789abcdef0123456789abcdef
        run: pytest -q
