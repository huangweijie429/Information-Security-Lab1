<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TOTP authenticator</title>
<style>
  body { margin:0; font-family: "Segoe UI", Arial, sans-serif;
         background:#0f1720; color:#e8eef5; display:flex; justify-content:center;
         align-items:center; height:100vh; }
  .card { width: 480px; background:#182230; border:1px solid #24303f; border-radius:18px;
          padding: 28px 32px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .row { display:flex; align-items:center; gap:14px; }
  .avatar { width:44px; height:44px; border-radius:12px; background:#1f6feb;
            display:flex; align-items:center; justify-content:center; font-weight:700; }
  .name { font-size:16px; font-weight:600; }
  .sub { font-size:12px; color:#8b9bb0; }
  .code { font-family: Consolas, monospace; font-size:52px; letter-spacing:10px;
          margin:26px 0 8px; color:#7ee787; }
  .bar { height:6px; background:#24303f; border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; background:#7ee787; width:100%; transition: width .3s linear; }
  .meta { display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color:#8b9bb0; }
  .foot { margin-top:22px; font-size:12px; color:#61748c; border-top:1px solid #24303f; padding-top:14px; }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="avatar">GH</div>
    <div>
      <div class="name">GitHub</div>
      <div class="sub">alice-dev &middot; TOTP (RFC 6238)</div>
    </div>
  </div>
  <div class="code" id="code">------</div>
  <div class="bar"><div id="bar"></div></div>
  <div class="meta"><span id="left">30s</span><span>SHA-1 &middot; 6 digits &middot; 30 s</span></div>
  <div class="foot">Secret is the same otpauth:// key stored in the vault entry <b>GitHub (2FA)</b>.<br>
  Computed locally, no network access.</div>
</div>
<script>
function sha1(bytes) {
  const ml = bytes.length * 8;
  const withOne = bytes.concat([0x80]);
  while (withOne.length % 64 !== 56) withOne.push(0);
  const lenBytes = [];
  for (let i = 7; i >= 0; i--) lenBytes.push((ml / Math.pow(2, i * 8)) & 0xff);
  const msg = withOne.concat(lenBytes);
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  const rol = (n, s) => ((n << s) | (n >>> (32 - s))) >>> 0;
  for (let i = 0; i < msg.length; i += 64) {
    const w = new Array(80).fill(0);
    for (let j = 0; j < 16; j++) w[j] = (msg[i+4*j]<<24) | (msg[i+4*j+1]<<16) | (msg[i+4*j+2]<<8) | msg[i+4*j+3];
    for (let j = 16; j < 80; j++) w[j] = rol(w[j-3] ^ w[j-8] ^ w[j-14] ^ w[j-16], 1);
    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let j = 0; j < 80; j++) {
      let f, k;
      if (j < 20) { f = (b & c) | (~b & d); k = 0x5A827999; }
      else if (j < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (j < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const t = (rol(a,5) + f + e + k + w[j]) >>> 0;
      e = d; d = c; c = rol(b,30); b = a; a = t;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0;
    h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  const out = [];
  [h0,h1,h2,h3,h4].forEach(h => out.push((h>>>24)&255,(h>>>16)&255,(h>>>8)&255,h&255));
  return out;
}
function hmacSha1(key, msg) {
  if (key.length > 64) key = sha1(key);
  const k = key.concat(new Array(64 - key.length).fill(0));
  const o = k.map(b => b ^ 0x5c), i = k.map(b => b ^ 0x36);
  return sha1(o.concat(sha1(i.concat(msg))));
}
function base32Decode(s) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits = 0, value = 0; const out = [];
  for (const ch of s.replace(/=+$/, '').toUpperCase()) {
    const idx = alphabet.indexOf(ch);
    if (idx < 0) continue;
    value = (value << 5) | idx; bits += 5;
    if (bits >= 8) { out.push((value >>> (bits - 8)) & 0xff); bits -= 8; }
  }
  return out;
}
function totp(secret, period = 30, digits = 6) {
  const counter = Math.floor(Date.now() / 1000 / period);
  const msg = [0,0,0,0].concat([(counter>>>24)&255,(counter>>>16)&255,(counter>>>8)&255,counter&255]);
  const h = hmacSha1(base32Decode(secret), msg);
  const off = h[h.length - 1] & 0x0f;
  const bin = ((h[off] & 0x7f) << 24) | (h[off+1] << 16) | (h[off+2] << 8) | h[off+3];
  return String(bin % Math.pow(10, digits)).padStart(digits, '0');
}
const SECRET = 'JBSWY3DPEHPK3PXP';
function tick() {
  const code = totp(SECRET);
  document.getElementById('code').textContent = code.slice(0,3) + ' ' + code.slice(3);
  const left = 30 - (Math.floor(Date.now()/1000) % 30);
  document.getElementById('left').textContent = left + 's';
  document.getElementById('bar').style.width = (left / 30 * 100) + '%';
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
