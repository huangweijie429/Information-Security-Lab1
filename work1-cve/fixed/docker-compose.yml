services:
  web:
    build:
      context: ..
      dockerfile: fixed/Dockerfile
    image: hdu-is/cve-2018-12613:fixed
    ports:
      - "8081:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:5.5
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=test
      - MYSQL_USER=test
      - MYSQL_PASSWORD=test
